# Shell — launch tmux, attaching to existing session or creating one
shell /usr/bin/bash -l -c "tmux new-session -A -s main"

# Font
font_family      RobotoMono Nerd Font Regular
bold_font        RobotoMono Nerd Font Bold
italic_font      RobotoMono Nerd Font Italic
bold_italic_font RobotoMono Nerd Font Bold Italic
font_size        16.0

# Window
startup_session  none
remember_window_size yes
initial_window_width  100c
initial_window_height 30c
window_padding_width  0

# OSC 52 clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Keyboard
map F11 toggle_fullscreen

# Colors — Tokyo Night
foreground #a9b1d6
background #1a1b26

selection_background #7aa2f7
selection_foreground none

# Normal colors
color0  #32344a
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #ad8ee6
color6  #449dab
color7  #787c99

# Bright colors
color8  #444b6a
color9  #ff7a93
color10 #b9f27c
color11 #ff9e64
color12 #7da6ff
color13 #bb9af7
color14 #0db9d7
color15 #acb0d0
